plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "2100"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.3.0"

android {
    namespace "com.btcmorning.btcmarketpro"
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    signingConfigs {
        release {
            keyAlias      System.getenv("CM_KEY_ALIAS")        ?: ""
            keyPassword   System.getenv("CM_KEY_PASSWORD")     ?: ""
            storeFile     System.getenv("CM_KEYSTORE_PATH") ?
                          file(System.getenv("CM_KEYSTORE_PATH")) : null
            storePassword System.getenv("CM_KEYSTORE_PASSWORD") ?: ""
        }
    }

    defaultConfig {
        applicationId   "com.btcmorning.btcmarketpro"
        minSdk          21
        targetSdk       35
        versionCode     flutterVersionCode.toInteger()
        versionName     flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            signingConfig   signingConfigs.release
            minifyEnabled   false
            shrinkResources false
            debuggable      false
        }
    }

    splits {
        abi { enable false }
    }

    lint {
        disable 'InvalidPackage'
        checkReleaseBuilds false
        abortOnError false
    }

    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:1.13.1"
        }
    }
}

flutter {
    source "../.."
}

tasks.whenTaskAdded { task ->
    if (task.name.startsWith("process") && task.name.endsWith("Manifest")) {
        task.doLast {
            def outputDir = task.outputs.files.first()
            def manifestFile = new File(outputDir, "AndroidManifest.xml")
            if (!manifestFile.exists()) {
                outputDir.eachFileRecurse { f ->
                    if (f.name == "AndroidManifest.xml") manifestFile = f
                }
            }
            if (manifestFile.exists()) {
                def content = manifestFile.text
                content = content.replace('<uses-permission android:name="android.permission.CAMERA"/>', '')
                content = content.replace('<uses-permission android:name="android.permission.CAMERA" />', '')
                content = content.replace('<uses-permission android:name="android.permission.RECORD_AUDIO"/>', '')
                content = content.replace('<uses-permission android:name="android.permission.RECORD_AUDIO" />', '')
                content = content.replaceAll(/(?m).*android\.hardware\.camera.*\n/, '')
                manifestFile.text = content
                println "✅ CAMERA/RECORD_AUDIO izinleri manifest'ten silindi"
            }
        }
    }
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}