plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "2100"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.3.0"

android {
    namespace "com.btcmorning.btcmarketpro"
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    signingConfigs {
        release {
            keyAlias      System.getenv("CM_KEY_ALIAS")        ?: ""
            keyPassword   System.getenv("CM_KEY_PASSWORD")     ?: ""
            storeFile     System.getenv("CM_KEYSTORE_PATH") ?
                          file(System.getenv("CM_KEYSTORE_PATH")) : null
            storePassword System.getenv("CM_KEYSTORE_PASSWORD") ?: ""
        }
    }

    defaultConfig {
        applicationId   "com.btcmorning.btcmarketpro"
        minSdk          21
        targetSdk       35
        versionCode     flutterVersionCode.toInteger()
        versionName     flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            signingConfig   signingConfigs.release
            minifyEnabled   false
            shrinkResources false
            debuggable      false
        }
    }

    splits {
        abi {
            enable false
        }
    }

    lint {
        disable 'InvalidPackage'
        checkReleaseBuilds false
        abortOnError false
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}