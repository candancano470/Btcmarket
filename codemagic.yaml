- name: AAB ve APK Derle
        script: |
          cd $CM_BUILD_DIR
          mkdir -p output

          # Önce Gradle'ı direkt çalıştır — tam hata görsün
          cd android
          ./gradlew bundleRelease --stacktrace --info 2>&1 | tail -100
          cd ..

          # AAB — Google Play
          flutter build appbundle \
            --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --no-tree-shake-icons \
            --verbose

          AAB=$(find $CM_BUILD_DIR -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "=== TÜM AAB ARAMASI ==="
            find $CM_BUILD_DIR -name "*.aab" 2>/dev/null
            find /Users/builder -name "*.aab" 2>/dev/null
            echo "HATA: AAB bulunamadı!"
            exit 1
          fi
          cp "$AAB" $CM_BUILD_DIR/output/app-release.aab
          echo "✓ AAB hazır: $AAB"

          # APK — Direkt yükleme
          flutter build apk \
            --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --no-tree-shake-icons

          APK=$(find $CM_BUILD_DIR -name "app-release.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "HATA: APK bulunamadı!"
            exit 1
          fi
          cp "$APK" $CM_BUILD_DIR/output/app-release.apk
          echo "✓ APK hazır"