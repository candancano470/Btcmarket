workflows:
  android-release:
    name: BTCMarketPro Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.29.3
      java: 17
      android_signing:
        - btcmarketpro

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Flutter Kontrolü
        script: |
          flutter --version
          flutter doctor -v

      - name: Paketleri Yükle
        script: flutter pub get

      - name: CAMERA İzin Yaması
        script: |
          echo "=== CAMERA PATCH BAŞLIYOR ==="

          # InAppWebViewChromeClient.java bul
          CHROME_CLIENT=$(find $HOME/.pub-cache -name "InAppWebViewChromeClient.java" 2>/dev/null | grep -i "inappwebview" | head -1)

          if [ -z "$CHROME_CLIENT" ]; then
            echo "HATA: InAppWebViewChromeClient.java bulunamadı!"
            find $HOME/.pub-cache -name "*.java" | grep -i "inappwebview" | head -20
            exit 1
          fi

          echo "Yamalanacak dosya: $CHROME_CLIENT"

          python3 - "$CHROME_CLIENT" << 'PYEOF'
          import sys, re

          path = sys.argv[1]

          with open(path, 'r') as f:
              content = f.read()

          # Zaten yamalıysa atla
          if 'BTCMARKETPRO_PATCH' in content:
              print("Zaten yamalı, atlanıyor.")
              sys.exit(0)

          deny_block = '''
                  // BTCMARKETPRO_PATCH: Kamera ve ses iznini her zaman reddet
                  if (request != null && request.getResources() != null) {
                      for (String r : request.getResources()) {
                          if (android.webkit.PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r) ||
                              android.webkit.PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) {
                              request.deny();
                              return;
                          }
                      }
                  }'''

          patched = False

          # Varyant 1: final ile
          sig1 = 'public void onPermissionRequest(final PermissionRequest request) {'
          if sig1 in content:
              content = content.replace(sig1, sig1 + deny_block, 1)
              patched = True
              print(f"Yamalandı (varyant 1: final)")

          # Varyant 2: final olmadan
          if not patched:
              sig2 = 'public void onPermissionRequest(PermissionRequest request) {'
              if sig2 in content:
                  content = content.replace(sig2, sig2 + deny_block, 1)
                  patched = True
                  print(f"Yamalandı (varyant 2: final'siz)")

          # Varyant 3: Regex ile
          if not patched:
              pattern = r'(public\s+void\s+onPermissionRequest\s*\([^)]*PermissionRequest[^)]*\)\s*\{)'
              m = re.search(pattern, content)
              if m:
                  content = content[:m.end()] + deny_block + content[m.end():]
                  patched = True
                  print("Yamalandı (varyant 3: regex)")

          if not patched:
              print("HATA: onPermissionRequest metodu bulunamadı!")
              # Debug: metod imzalarını göster
              for i, line in enumerate(content.split('\n')):
                  if 'onPermissionRequest' in line or 'PermissionRequest' in line:
                      print(f"  Satır {i}: {line.strip()}")
              sys.exit(1)

          with open(path, 'w') as f:
              f.write(content)

          print("Patch başarıyla uygulandı.")
          PYEOF

          echo "Patch sonucu kontrol:"
          grep -n "BTCMARKETPRO_PATCH\|request\.deny\|RESOURCE_VIDEO" "$CHROME_CLIENT" | head -10

          # image_picker AndroidManifest'inden CAMERA kaldır
          IMAGE_PICKER=$(find $HOME/.pub-cache -path "*image_picker_android*" -name "AndroidManifest.xml" 2>/dev/null | head -1)
          if [ -n "$IMAGE_PICKER" ]; then
            sed -i '/android\.permission\.CAMERA/d' "$IMAGE_PICKER"
            echo "image_picker manifest temizlendi: $IMAGE_PICKER"
          fi

          echo "=== CAMERA PATCH TAMAM ==="

      - name: Splash Screen Oluştur
        script: |
          cd $CM_BUILD_DIR
          dart run flutter_native_splash:create

      - name: Uygulama İkonları Oluştur
        script: |
          cd $CM_BUILD_DIR
          pip3 install Pillow
          python3 - << 'EOF'
          import os, sys
          from PIL import Image

          build_dir = os.environ.get("CM_BUILD_DIR", ".")
          logo_path = os.path.join(build_dir, "assets/logo.png")

          if not os.path.exists(logo_path):
              print("ERROR: logo.png bulunamadı!")
              sys.exit(1)

          sizes = {
              "mipmap-mdpi":     48,
              "mipmap-hdpi":     72,
              "mipmap-xhdpi":    96,
              "mipmap-xxhdpi":  144,
              "mipmap-xxxhdpi": 192,
          }

          logo = Image.open(logo_path).convert("RGBA")
          bbox = logo.getbbox()
          if bbox:
              logo = logo.crop(bbox)

          for folder, size in sizes.items():
              path = os.path.join(build_dir, f"android/app/src/main/res/{folder}")
              os.makedirs(path, exist_ok=True)
              icon = logo.resize((size, size), Image.LANCZOS)
              icon.save(f"{path}/ic_launcher.png")
              icon.save(f"{path}/ic_launcher_round.png")
              print(f"✓ {folder}: {size}x{size}")
          EOF

      - name: local.properties Ayarla
        script: |
          VERSION_CODE=$((2000 + BUILD_NUMBER))
          echo "flutter.sdk=$FLUTTER_ROOT" > $CM_BUILD_DIR/android/local.properties
          echo "flutter.versionCode=$VERSION_CODE" >> $CM_BUILD_DIR/android/local.properties
          echo "flutter.versionName=1.2.$BUILD_NUMBER" >> $CM_BUILD_DIR/android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> $CM_BUILD_DIR/android/local.properties
          cat $CM_BUILD_DIR/android/local.properties

      - name: İmza Kontrolü
        script: |
          echo "Keystore path: $CM_KEYSTORE_PATH"
          echo "Key alias: $CM_KEY_ALIAS"
          ls -la "$CM_KEYSTORE_PATH" || echo "HATA: Keystore bulunamadı!"

      - name: AAB ve APK Derle
        script: |
          cd $CM_BUILD_DIR
          mkdir -p output
          VERSION_CODE=$((2000 + BUILD_NUMBER))

          flutter build appbundle \
            --release \
            --build-name=1.2.$BUILD_NUMBER \
            --build-number=$VERSION_CODE \
            --no-tree-shake-icons

          AAB="/Users/builder/clone/android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB" ]; then
            echo "HATA: AAB bulunamadı!"
            exit 1
          fi
          cp "$AAB" $CM_BUILD_DIR/output/app-release.aab
          echo "✓ AAB hazır"

          flutter build apk \
            --release \
            --build-name=1.2.$BUILD_NUMBER \
            --build-number=$VERSION_CODE \
            --no-tree-shake-icons

          APK="/Users/builder/clone/android/app/build/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "HATA: APK bulunamadı!"
            exit 1
          fi
          cp "$APK" $CM_BUILD_DIR/output/app-release.apk
          echo "✓ APK hazır"

      - name: Build Özeti
        script: |
          VERSION_CODE=$((2000 + BUILD_NUMBER))
          echo "================================"
          echo "  BTCMarketPro Build Tamamlandı"
          echo "================================"
          echo "Version : 1.2.$BUILD_NUMBER ($VERSION_CODE)"
          echo "Branch  : $CM_BRANCH"
          echo "================================"
          ls -lh $CM_BUILD_DIR/output/

    artifacts:
      - output/app-release.aab
      - output/app-release.apk

    publishing:
      email:
        recipients:
          - airdroptour@gmail.com
        notify:
          success: true
          failure: true