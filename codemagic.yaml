- name: AAB ve APK Derle
        script: |
          cd $CM_BUILD_DIR
          mkdir -p output

          flutter build appbundle \
            --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --no-tree-shake-icons \
            --verbose 2>&1 | tee /tmp/flutter_build.log || true

          echo "=== Son 50 satır ==="
          tail -50 /tmp/flutter_build.log

          AAB=$(find $CM_BUILD_DIR/build -name "*.aab" 2>/dev/null | head -1)
          if [ -z "$AAB" ]; then
            echo "HATA: AAB bulunamadı!"
            find $CM_BUILD_DIR/build -type f 2>/dev/null | grep -E "\.(aab|apk|jar)" || true
            exit 1
          fi
          cp "$AAB" $CM_BUILD_DIR/output/app-release.aab
          echo "✓ AAB hazır: $AAB"

          flutter build apk \
            --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --no-tree-shake-icons

          APK=$(find $CM_BUILD_DIR/build -name "app-release.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "HATA: APK bulunamadı!"
            exit 1
          fi
          cp "$APK" $CM_BUILD_DIR/output/app-release.apk
          echo "✓ APK hazır: $APK"